name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: apps/web

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # Post-Phase-25 CI hardening (see docs/PRODUCTION_READINESS.md and
      # docs/SECURITY_HARDENING.md §Not yet in this phase, which had
      # flagged automated dependency-vulnerability scanning in CI as not
      # yet done) — matches `npm audit`'s clean result confirmed manually
      # during Phase 23/24/25; this makes that check run on every push
      # instead of being a one-time manual check that goes stale.
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # None of the current e2e specs call the Laravel backend (they
      # cover proxy.ts redirects, PWA manifest/icons/service-worker, SEO
      # metadata, and security headers — all Next.js-app-only behavior),
      # so this job deliberately doesn't stand up Postgres/Redis/Laravel
      # — playwright.config.ts's own `webServer` starts `npm run dev` and
      # waits for it. A future spec that does need the backend will need
      # this job extended, not a reason to skip having this job at all
      # (this project's Phase 21/22/23 real bugs — a strict CSP breaking
      # hydration, proxy.ts blocking public metadata routes — were all
      # only ever caught by actually running this suite, never by
      # typecheck/lint/build alone, and it had never run in CI before
      # this).
      - name: Playwright e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
