name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: apps/backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tow_platform_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pcntl, posix, pgsql, pdo_pgsql, redis
          coverage: none

      # Must happen before `composer install`, not after — its
      # post-autoload-dump hook (`artisan package:discover`) fully boots
      # the framework, which resolves the default broadcaster
      # (config/broadcasting.php defaults to 'reverb' even with no .env
      # file at all) and crashes constructing a Pusher client with a
      # null auth key. Real Phase-25-adjacent CI bug found via `gh run
      # list` after pushing: composer install itself had been failing on
      # every fresh checkout since Reverb was introduced (Phase 10),
      # invisible locally because every dev machine already has a real
      # .env with these values generated once and kept ever since.
      - name: Copy environment file
        run: cp .env.example .env

      # REVERB_APP_ID/KEY/SECRET are locally-generated identifiers for
      # the self-hosted Reverb server, not a third-party credential (see
      # docs/DEPLOYMENT.md §Realtime (Reverb)) — any non-empty value
      # works for CI, which never actually starts Reverb.
      - name: Generate CI-only Reverb identifiers
        run: |
          sed -i 's/^REVERB_APP_ID=$/REVERB_APP_ID=ci-app-id/' .env
          sed -i 's/^REVERB_APP_KEY=$/REVERB_APP_KEY=ci-app-key/' .env
          sed -i 's/^REVERB_APP_SECRET=$/REVERB_APP_SECRET=ci-app-secret/' .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Enable PostGIS on test database
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d tow_platform_testing -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Run migrations
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: tow_platform_testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: 127.0.0.1
        run: php artisan migrate --force

      - name: Pint (style check)
        run: vendor/bin/pint --test

      - name: Larastan (static analysis)
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: PHPUnit
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: tow_platform_testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: 127.0.0.1
        run: php artisan test

      # Post-Phase-25 CI hardening (see docs/PRODUCTION_READINESS.md and
      # docs/SECURITY_HARDENING.md §Not yet in this phase, which had
      # flagged automated dependency-vulnerability scanning in CI as not
      # yet done) — matches `composer audit`'s clean result confirmed
      # manually during Phase 23/24/25; this makes that check run on
      # every push instead of being a one-time manual check that goes
      # stale.
      - name: Dependency vulnerability audit
        run: composer audit
