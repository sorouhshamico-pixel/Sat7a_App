# Local development infrastructure for environments where Docker is available.
# The initial development machine did not have Docker, so it runs the same
# services (PostgreSQL+PostGIS, Redis) natively instead — see docs/DEPLOYMENT.md.
# This file is kept so other contributors / CI-adjacent environments can use it.

services:
  postgres:
    image: postgis/postgis:17-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tow_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
