# nginx reverse proxy — see docs/DEPLOYMENT.md and
# docs/PRODUCTION_READINESS.md. Terminates TLS, forwards the API to
# php-fpm, and proxies Reverb's WebSocket upgrade separately (Reverb
# itself only binds a plain HTTP/WS listener on 127.0.0.1:8080 — see
# infrastructure/systemd-reverb.service).
#
# The X-Forwarded-Proto/X-Forwarded-For headers set below are what
# apps/backend/bootstrap/app.php's `trustProxies()` call actually reads
# (see docs/SECURITY.md §HTTPS enforcement) — get these wrong here and
# the backend's own trusted-proxy fix has nothing correct to trust. Set
# `TRUSTED_PROXIES` in the backend's .env to this nginx host's real IP
# (or the load balancer in front of it, if any) once deployed.
#
# Copy to /etc/nginx/sites-available/riyadh-tow, symlink into
# sites-enabled, adjust server_name/paths/cert paths, then
# `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    root /var/www/riyadh-tow/apps/backend/public;
    index index.php;

    client_max_body_size 12m; # slightly above the 10MB document-upload cap (docs/SECURITY.md §File uploads)

    # Realtime — Reverb's WebSocket endpoint (Pusher-protocol-compatible,
    # docs/REALTIME.md). Must come before the generic `location /` block
    # so the upgrade headers below actually apply to this path.
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400; # keep long-lived WebSocket connections open
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        # Same forwarded headers as the WebSocket block above — this is
        # what makes $request->isSecure()/$request->ip() correct inside
        # Laravel once trustProxies() is configured for this proxy's IP.
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
